<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edge Cases Test Harness</title>
</head>
<body>
  <iframe id="appFrame" src="file:///D:/MathForge/index.html" style="width:1920px; height:1080px; border:none;"></iframe>
  <pre id="testOutput"></pre>

  <script>
    const iframe = document.getElementById('appFrame');
    const out = document.getElementById('testOutput');

    const results = {
      total: 0,
      passed: 0,
      failed: 0,
      details: []
    };

    function assert(name, condition, extra) {
      results.total++;
      if (condition) {
        results.passed++;
        results.details.push({ test: name, status: 'PASS', extra: extra || '' });
      } else {
        results.failed++;
        results.details.push({ test: name, status: 'FAIL', extra: extra || '' });
      }
    }

    iframe.onload = function() {
      try {
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument;
        const mf = win.MathForgeWorkspace;

        if (!mf || !mf.getState().initialized) {
          throw new Error('MathForgeWorkspace failed to initialize inside iframe.');
        }

        // =========================================================================
        // SECTION 1: High-DPI DPR-Only Verification & Invalid devicePixelRatio
        // =========================================================================

        // Test 1.1: Setting up canvas and container with known physical dimensions
        const testContainer = doc.createElement('div');
        testContainer.style.width = '100px';
        testContainer.style.height = '100px';
        testContainer.style.position = 'absolute';
        testContainer.style.left = '-9999px';
        doc.body.appendChild(testContainer);

        const testCanvas = doc.createElement('canvas');
        testContainer.appendChild(testCanvas);

        // First sizing with DPR = 2.0
        const fit1 = mf.fitCanvasToContainer(testCanvas, testContainer, { dpr: 2.0 });
        assert('1.1 Initial fit: physical width is 200', testCanvas.width === 200);
        assert('1.1 Initial fit: physical height is 200', testCanvas.height === 200);
        assert('1.1 Initial fit: changed flag is true', fit1.changed === true);
        assert('1.1 Initial fit: transformChanged is true', fit1.transformChanged === true);

        // Spy on canvas.width and canvas.height setter invocations
        let widthSetCount = 0;
        let heightSetCount = 0;
        const origWidthDesc = Object.getOwnPropertyDescriptor(win.HTMLCanvasElement.prototype, 'width');
        const origHeightDesc = Object.getOwnPropertyDescriptor(win.HTMLCanvasElement.prototype, 'height');

        Object.defineProperty(testCanvas, 'width', {
          get: function() { return origWidthDesc.get.call(this); },
          set: function(val) { widthSetCount++; return origWidthDesc.set.call(this, val); },
          configurable: true
        });
        Object.defineProperty(testCanvas, 'height', {
          get: function() { return origHeightDesc.get.call(this); },
          set: function(val) { heightSetCount++; return origHeightDesc.set.call(this, val); },
          configurable: true
        });

        // Spy on 2D context setTransform calls
        const ctx2d = testCanvas.getContext('2d');
        const transformCalls = [];
        const origSetTransform = ctx2d.setTransform.bind(ctx2d);
        ctx2d.setTransform = function(a, b, c, d, e, f) {
          transformCalls.push({ a: a, b: b, c: c, d: d, e: e, f: f });
          return origSetTransform(a, b, c, d, e, f);
        };

        // Test 1.2: DPR changes while rounded physical dimensions stay exactly 200x200
        // Container: 100x100. DPR: 2.001. Math.round(100 * 2.001) = Math.round(200.1) = 200.
        const fit2 = mf.fitCanvasToContainer(testCanvas, testContainer, { dpr: 2.001 });

        assert('1.2 DPR changed but physical dimensions rounded identically to 200', Math.round(100 * 2.001) === 200);
        assert('1.2 canvas.width was NOT reassigned', widthSetCount === 0, 'widthSetCount: ' + widthSetCount);
        assert('1.2 canvas.height was NOT reassigned', heightSetCount === 0, 'heightSetCount: ' + heightSetCount);
        assert('1.2 ctx.setTransform received the new DPR (2.001)', transformCalls.length === 1 && transformCalls[0].a === 2.001 && transformCalls[0].d === 2.001);
        assert('1.2 fitCanvasToContainer returned changed === false', fit2.changed === false);
        assert('1.2 fitCanvasToContainer returned transformChanged === true', fit2.transformChanged === true);
        assert('1.2 fitCanvasToContainer returned dpr === 2.001', fit2.dpr === 2.001);

        // Test 1.3: Invalid window.devicePixelRatio values
        const origSysDpr = win.devicePixelRatio;

        const invalidValues = [0, -1, -2.5, NaN, Infinity, -Infinity, 'invalid-dpr', null, undefined];
        for (let j = 0; j < invalidValues.length; j++) {
          const badVal = invalidValues[j];
          try {
            Object.defineProperty(win, 'devicePixelRatio', { value: badVal, configurable: true, writable: true });
          } catch(e) {
            win.devicePixelRatio = badVal;
          }
          const effDpr = mf.getEffectiveDpr();
          assert('1.3 Invalid window.devicePixelRatio (' + String(badVal) + ') falls back to 1.0', effDpr === 1);
        }

        // Test valid window.devicePixelRatio
        Object.defineProperty(win, 'devicePixelRatio', { value: 2.5, configurable: true, writable: true });
        assert('1.3 Valid window.devicePixelRatio (2.5) is returned correctly', mf.getEffectiveDpr() === 2.5);

        // Restore system DPR
        Object.defineProperty(win, 'devicePixelRatio', { value: origSysDpr, configurable: true, writable: true });

        // Clean up test canvas
        doc.body.removeChild(testContainer);

        // =========================================================================
        // SECTION 2: ResizeObserver Reentrancy, Coalescing, and Teardown Cleanup
        // =========================================================================

        // Controlled RAF execution pipeline to test animation-frame based scheduler
        const rafMap = new Map();
        let nextRafId = 1;
        const origRaf = win.requestAnimationFrame;
        const origCancel = win.cancelAnimationFrame;

        win.requestAnimationFrame = function(cb) {
          const id = nextRafId++;
          rafMap.set(id, cb);
          return id;
        };

        win.cancelAnimationFrame = function(id) {
          rafMap.delete(id);
        };

        function flushRafs() {
          const callbacks = Array.from(rafMap.values());
          rafMap.clear();
          for (let i = 0; i < callbacks.length; i++) {
            callbacks[i]();
          }
        }

        // Re-initialize workspace so it uses the controlled requestAnimationFrame
        mf.init();
        // Flush any initial layout notification so system is in quiescent state
        flushRafs();

        const mountContainer = doc.getElementById('mfToolMountContainer');

        let resizeCallbackCount = 0;
        let isInsideResize = false;
        let recursionDetected = false;
        const observedDimensions = [];

        const reentrantTool = {
          id: 'test-reentrant-tool',
          name: 'Reentrant Resize Tool',
          mount: function(c) {},
          resize: function(w, h, dpr) {
            if (isInsideResize) {
              recursionDetected = true;
            }
            isInsideResize = true;
            resizeCallbackCount++;
            observedDimensions.push({ w: w, h: h });

            // On the FIRST resize callback, mutate the observed container height to a DIFFERENT value
            if (resizeCallbackCount === 1) {
              mountContainer.style.height = '350px';
              // Trigger scheduled resize notification
              win.dispatchEvent(new win.Event('resize'));
            }

            isInsideResize = false;
          },
          unmount: function() {}
        };

        mf.registerTool(reentrantTool);
        mf.selectTool('test-reentrant-tool');

        // Trigger first resize notification via panel collapse
        mf.togglePanel('left');

        // First flush runs callback 1: inside callback 1, container height is set to 350px
        flushRafs();

        assert('2.1 No recursive resize execution detected', recursionDetected === false);
        assert('2.1 First callback completed cleanly', resizeCallbackCount === 1);

        // Second flush executes the subsequent resize notification caused by the container mutation
        flushRafs();

        assert('2.1 Subsequent genuine size change was not silently lost', resizeCallbackCount === 2);
        assert('2.1 Observed distinct dimensions across both calls', observedDimensions.length === 2 && (observedDimensions[0].w !== observedDimensions[1].w || observedDimensions[0].h !== observedDimensions[1].h), 'Dimensions: ' + JSON.stringify(observedDimensions));

        // Third flush confirms no infinite loop occurs (no more pending RAFs)
        flushRafs();
        assert('2.1 No infinite loop (total callbacks bounded to 2)', resizeCallbackCount === 2, 'Total callbacks: ' + resizeCallbackCount);

        // Reset container height style
        mountContainer.style.height = '';

        // Test 2.2: Rapid resize bursts are coalesced
        const burstTool = {
          id: 'test-burst-tool',
          name: 'Burst Tool',
          mount: function(c) {},
          resize: function(w, h, dpr) {
            burstTool.callbacks++;
          },
          unmount: function() {},
          callbacks: 0
        };
        mf.registerTool(burstTool);
        mf.selectTool('test-burst-tool');
        flushRafs();
        burstTool.callbacks = 0;

        // Rapid burst: 10 panel toggle notifications in the same frame
        for (let b = 0; b < 10; b++) {
          mf.togglePanel('bottom');
        }

        assert('2.2 Rapid resize burst coalesced into single pending animation frame', rafMap.size === 1, 'Pending frames: ' + rafMap.size);
        flushRafs();
        assert('2.2 Rapid resize bursts executed exactly 1 callback', burstTool.callbacks === 1, 'Executed: ' + burstTool.callbacks);

        // Test 2.3: Pending RAF/setTimeout work cancelled during destroy
        const teardownTool = {
          id: 'test-teardown-tool',
          name: 'Teardown Tool',
          mount: function(c) {},
          resize: function(w, h, dpr) {
            teardownTool.callbacks++;
          },
          unmount: function() {},
          callbacks: 0
        };
        mf.registerTool(teardownTool);
        mf.selectTool('test-teardown-tool');
        flushRafs();
        teardownTool.callbacks = 0;

        // Schedule resize frame, then immediately destroy
        mf.togglePanel('right');
        assert('2.3 Pre-condition: pending RAF is scheduled before destroy', rafMap.size === 1);

        mf.destroy();
        assert('2.3 cancelPendingResize cancelled pending RAF during destroy', rafMap.size === 0, 'Pending frames after destroy: ' + rafMap.size);

        flushRafs();
        assert('2.3 0 callbacks executed after destroy', teardownTool.callbacks === 0, 'Executed callbacks: ' + teardownTool.callbacks);

        // Test 2.4: No resize callback executes after destroy
        win.dispatchEvent(new win.Event('resize'));
        flushRafs();
        assert('2.4 No resize callback executes on subsequent resize events after destroy', teardownTool.callbacks === 0);

        // Restore original RAF functions
        win.requestAnimationFrame = origRaf;
        win.cancelAnimationFrame = origCancel;

        // =========================================================================
        // SECTION 3: Complete Tab Keyboard Verification
        // =========================================================================

        // Re-initialize workspace for Section 3
        mf.init();

        const tab0 = doc.getElementById('mfDocTab-untitled-1');
        const canvasSheet = doc.getElementById('mfCanvasSheet');

        // Test Case 3A: Single Production Document Tab ('untitled-1')
        // Test all 6 keyboard interactions independently on the production tab strip:

        // 3.1 Enter on focused Tab 0
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));

        assert('3.1 Enter retains focus on tab', doc.activeElement === tab0);
        assert('3.1 Enter activates document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.1 Enter sets tabindex to 0', tab0.getAttribute('tabindex') === '0');
        assert('3.1 Enter sets aria-selected to true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.1 Enter pairs tabpanel aria-labelledby to mfDocTab-untitled-1', canvasSheet.getAttribute('aria-labelledby') === 'mfDocTab-untitled-1');

        // 3.2 Space on focused Tab 0
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: ' ', bubbles: true }));

        assert('3.2 Space retains focus on tab', doc.activeElement === tab0);
        assert('3.2 Space activates document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.2 Space sets tabindex to 0', tab0.getAttribute('tabindex') === '0');
        assert('3.2 Space sets aria-selected to true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.2 Space pairs tabpanel aria-labelledby to mfDocTab-untitled-1', canvasSheet.getAttribute('aria-labelledby') === 'mfDocTab-untitled-1');

        // 3.3 ArrowRight on single tab (boundary wrap to self)
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));

        assert('3.3 ArrowRight retains focus on single tab', doc.activeElement === tab0);
        assert('3.3 ArrowRight preserves active document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.3 ArrowRight preserves tabindex 0', tab0.getAttribute('tabindex') === '0');
        assert('3.3 ArrowRight preserves aria-selected true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.3 ArrowRight preserves tabpanel aria-labelledby', canvasSheet.getAttribute('aria-labelledby') === 'mfDocTab-untitled-1');

        // 3.4 ArrowLeft on single tab (boundary wrap to self)
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));

        assert('3.4 ArrowLeft retains focus on single tab', doc.activeElement === tab0);
        assert('3.4 ArrowLeft preserves active document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.4 ArrowLeft preserves tabindex 0', tab0.getAttribute('tabindex') === '0');
        assert('3.4 ArrowLeft preserves aria-selected true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.4 ArrowLeft preserves tabpanel aria-labelledby', canvasSheet.getAttribute('aria-labelledby') === 'mfDocTab-untitled-1');

        // 3.5 Home on single tab
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Home', bubbles: true }));

        assert('3.5 Home retains focus on single tab', doc.activeElement === tab0);
        assert('3.5 Home preserves active document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.5 Home preserves tabindex 0', tab0.getAttribute('tabindex') === '0');
        assert('3.5 Home preserves aria-selected true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.5 Home preserves tabpanel aria-labelledby', canvasSheet.getAttribute('aria-labelledby') === 'mfDocTab-untitled-1');

        // 3.6 End on single tab
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'End', bubbles: true }));

        assert('3.6 End retains focus on single tab', doc.activeElement === tab0);
        assert('3.6 End preserves active document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.6 End preserves tabindex 0', tab0.getAttribute('tabindex') === '0');
        assert('3.6 End preserves aria-selected true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.6 End preserves tabpanel aria-labelledby', canvasSheet.getAttribute('aria-labelledby') === 'mfDocTab-untitled-1');

        // Test Case 3B: Architectural Verification of Multi-Tab Focus Navigation
        // When multiple tab DOM nodes are rendered in the tablist:
        const tabList = doc.getElementById('mfDocTabsContainer');
        const tabExtra = doc.createElement('div');
        tabExtra.className = 'mf-doc-tab';
        tabExtra.setAttribute('data-tab-id', 'doc-extra');
        tabExtra.setAttribute('role', 'tab');
        tabExtra.setAttribute('id', 'mfDocTab-doc-extra');
        tabExtra.setAttribute('aria-controls', 'mfCanvasSheet');
        tabExtra.setAttribute('tabindex', '-1');
        tabExtra.textContent = 'Extra Document';
        tabList.appendChild(tabExtra);

        // ArrowRight from tab0 to tabExtra
        tab0.focus();
        tab0.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
        assert('3.7 Multi-tab ArrowRight moves focus to next tab', doc.activeElement === tabExtra);

        // ArrowLeft from tabExtra back to tab0
        tabExtra.focus();
        tabExtra.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
        assert('3.8 Multi-tab ArrowLeft moves focus back to first tab', doc.activeElement === tab0);
        assert('3.8 Multi-tab ArrowLeft activates registered document untitled-1', mf.getState().activeDocument === 'untitled-1');
        assert('3.8 Multi-tab ArrowLeft sets tab0 aria-selected to true', tab0.getAttribute('aria-selected') === 'true');
        assert('3.8 Multi-tab ArrowLeft sets tab0 tabindex to 0', tab0.getAttribute('tabindex') === '0');

        // Clean up extra tab
        tabList.removeChild(tabExtra);

        out.textContent = JSON.stringify(results, null, 2);
      } catch (err) {
        assert('Edge Case Harness Execution Error', false, err.message + '\n' + err.stack);
        out.textContent = JSON.stringify(results, null, 2);
      }
    };
  </script>
</body>
</html>
