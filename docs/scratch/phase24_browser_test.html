<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Phase 2.4 Browser Verification Suite</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    iframe { width: 1200px; height: 900px; border: 1px solid #ccc; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Phase 2.4 Browser Verification Suite</h1>
  <div id="status">Loading application iframe...</div>
  <pre id="output"></pre>
  <iframe id="appFrame" src="../../Coordinates_graph.html"></iframe>

  <script>
    const logEl = document.getElementById('output');
    const results = [];

    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    function PASS(id, title, details) {
      results.push({ id, status: 'PASS', title, details });
      log(`[PASS] [${id}] ${title}${details ? ' — ' + details : ''}`);
    }

    function FAIL(id, title, details) {
      results.push({ id, status: 'FAIL', title, details });
      log(`[FAIL] [${id}] ${title}${details ? ' — ' + details : ''}`);
    }

    function delay(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    const frame = document.getElementById('appFrame');

    frame.onload = async () => {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;

        // Verify Real Application elements
        const canvas = doc.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pointsInput = doc.getElementById('pointsInput');
        const drawBtn = doc.getElementById('drawBtn');
        const downloadBtn = doc.getElementById('downloadBtn');
        const resetBtn = doc.getElementById('resetBtn');

        // Phase 2.4 elements
        const viewZoomEl = doc.getElementById('viewZoom');
        const canvasBgColorEl = doc.getElementById('canvasBgColor');
        const resetViewBtn = doc.getElementById('resetViewBtn');
        const resetBgBtn = doc.getElementById('resetBgBtn');

        const gridVisibleEl = doc.getElementById('gridVisible');
        const gridColorEl = doc.getElementById('gridColor');
        const gridOpacityEl = doc.getElementById('gridOpacity');

        const xAxisVisibleEl = doc.getElementById('xAxisVisible');
        const yAxisVisibleEl = doc.getElementById('yAxisVisible');
        const axisColorEl = doc.getElementById('axisColor');
        const axisWidthEl = doc.getElementById('axisWidth');
        const axisLabelsVisibleEl = doc.getElementById('axisLabelsVisible');

        const showLabelsEl = doc.getElementById('showLabels');
        const coordPrecisionEl = doc.getElementById('coordPrecision');

        const allElements = [
          viewZoomEl, canvasBgColorEl, resetViewBtn, resetBgBtn,
          gridVisibleEl, gridColorEl, gridOpacityEl,
          xAxisVisibleEl, yAxisVisibleEl, axisColorEl, axisWidthEl, axisLabelsVisibleEl,
          showLabelsEl, coordPrecisionEl
        ];

        if (allElements.some(el => !el)) {
          FAIL('INIT', 'One or more Phase 2.4 DOM controls missing');
          return;
        }
        PASS('INIT', 'All Phase 2.4 DOM controls located in live application');

        function trigger(el) {
          el.dispatchEvent(new win.Event('input', { bubbles: true }));
          el.dispatchEvent(new win.Event('change', { bubbles: true }));
        }

        // Helper to count pixels matching RGB condition
        function countPixels(predicate) {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imgData.data;
          let count = 0;
          for (let i = 0; i < d.length; i += 4) {
            if (predicate(d[i], d[i+1], d[i+2], d[i+3])) {
              count++;
            }
          }
          return count;
        }

        // Helper to sample pixel at (x, y)
        function getPixel(x, y) {
          const d = ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
          return { r: d[0], g: d[1], b: d[2], a: d[3] };
        }

        // Setup a clear simple dataset: 3 points
        pointsInput.value = 'P(1,-1)\nQ(3,1)\nR(4,10/9)';
        trigger(pointsInput);
        drawBtn.click();
        await delay(50);

        // ==========================================
        // 1. GRID CONTROLS VERIFICATION
        // ==========================================

        // 1.1 Grid color & visibility
        gridColorEl.value = '#00aa00'; // Green grid
        gridOpacityEl.value = '50';    // 50% opacity
        gridVisibleEl.checked = true;
        trigger(gridColorEl);
        trigger(gridOpacityEl);
        trigger(gridVisibleEl);
        await delay(50);

        // Count greenish grid pixels: G > R and G > B with alpha > 0
        const greenGridPixelsOn = countPixels((r, g, b, a) => g > r + 20 && g > b + 20 && a === 255);

        // Turn grid OFF
        gridVisibleEl.checked = false;
        trigger(gridVisibleEl);
        await delay(50);

        const greenGridPixelsOff = countPixels((r, g, b, a) => g > r + 20 && g > b + 20 && a === 255);

        if (greenGridPixelsOn > 500 && greenGridPixelsOff === 0) {
          PASS('GRID-1', 'Grid visibility and custom color: grid rendered when ON, hidden when OFF',
               `Grid ON: ${greenGridPixelsOn}px green, Grid OFF: ${greenGridPixelsOff}px`);
        } else {
          FAIL('GRID-1', 'Grid toggle failed', `ON=${greenGridPixelsOn}, OFF=${greenGridPixelsOff}`);
        }

        // Restore grid
        gridColorEl.value = '#000000';
        gridOpacityEl.value = '15';
        gridVisibleEl.checked = true;
        trigger(gridColorEl);
        trigger(gridOpacityEl);
        trigger(gridVisibleEl);
        await delay(50);

        // ==========================================
        // 2. AXIS CONTROLS VERIFICATION
        // ==========================================

        // Set custom axis color to Red (#ff0000) and width to 6px
        axisColorEl.value = '#ff0000';
        axisWidthEl.value = '6';
        xAxisVisibleEl.checked = true;
        yAxisVisibleEl.checked = true;
        trigger(axisColorEl);
        trigger(axisWidthEl);
        trigger(xAxisVisibleEl);
        trigger(yAxisVisibleEl);
        await delay(50);

        const redAxisPixelsBoth = countPixels((r, g, b, a) => r > 200 && g < 40 && b < 40 && a === 255);

        // Toggle X-axis OFF
        xAxisVisibleEl.checked = false;
        trigger(xAxisVisibleEl);
        await delay(50);
        const redAxisPixelsXOff = countPixels((r, g, b, a) => r > 200 && g < 40 && b < 40 && a === 255);

        // Toggle Y-axis OFF (both axes OFF)
        yAxisVisibleEl.checked = false;
        trigger(yAxisVisibleEl);
        await delay(50);
        const redAxisPixelsBothOff = countPixels((r, g, b, a) => r > 200 && g < 40 && b < 40 && a === 255);

        if (redAxisPixelsBoth > redAxisPixelsXOff && redAxisPixelsXOff > redAxisPixelsBothOff) {
          PASS('AXIS-1', 'X-axis and Y-axis independent visibility toggles and custom color/width verified',
               `Both axes=${redAxisPixelsBoth}px, X-off=${redAxisPixelsXOff}px, Both-off=${redAxisPixelsBothOff}px`);
        } else {
          FAIL('AXIS-1', 'Axis toggles failed', `Both=${redAxisPixelsBoth}, XOff=${redAxisPixelsXOff}, BothOff=${redAxisPixelsBothOff}`);
        }

        // Restore axes
        xAxisVisibleEl.checked = true;
        yAxisVisibleEl.checked = true;
        axisColorEl.value = '#000000';
        axisWidthEl.value = '2';
        trigger(xAxisVisibleEl);
        trigger(yAxisVisibleEl);
        trigger(axisColorEl);
        trigger(axisWidthEl);
        await delay(50);

        // ==========================================
        // 3. BACKGROUND CONTROLS VERIFICATION
        // ==========================================

        // Set background color to Light Cyan (#e0f7fa: 224, 247, 250)
        canvasBgColorEl.value = '#e0f7fa';
        trigger(canvasBgColorEl);
        await delay(50);

        // Sample corner pixel (20, 20) where no axes or points exist
        const bgSample = getPixel(20, 20);
        const isCyanBg = bgSample.r >= 220 && bgSample.r <= 230 &&
                         bgSample.g >= 240 && bgSample.g <= 252 &&
                         bgSample.b >= 245 && bgSample.b <= 255;

        // Click Reset Background button
        resetBgBtn.click();
        await delay(50);
        const bgResetSample = getPixel(20, 20);
        const isWhiteBg = bgResetSample.r === 255 && bgResetSample.g === 255 && bgResetSample.b === 255;

        if (isCyanBg && isWhiteBg && canvasBgColorEl.value === '#ffffff') {
          PASS('BG-1', 'Canvas background color picker and reset button functional',
               `Custom RGB=(${bgSample.r},${bgSample.g},${bgSample.b}), Reset RGB=(${bgResetSample.r},${bgResetSample.g},${bgResetSample.b})`);
        } else {
          FAIL('BG-1', 'Canvas background failed', `Custom=${JSON.stringify(bgSample)}, Reset=${JSON.stringify(bgResetSample)}`);
        }

        // ==========================================
        // 4. COORDINATE PRECISION & LABELS
        // ==========================================

        // P(1,-1), Q(3,1), R(4,10/9)
        // With precision 'auto', R's label contains "10/9"
        coordPrecisionEl.value = 'auto';
        trigger(coordPrecisionEl);
        await delay(50);

        // With precision '2', R's label renders as 1.11
        coordPrecisionEl.value = '2';
        trigger(coordPrecisionEl);
        await delay(50);

        // With precision '0', R's label renders as 1
        coordPrecisionEl.value = '0';
        trigger(coordPrecisionEl);
        await delay(50);

        // Toggle showLabels OFF
        showLabelsEl.checked = false;
        trigger(showLabelsEl);
        await delay(50);

        // Toggle showLabels ON
        showLabelsEl.checked = true;
        coordPrecisionEl.value = 'auto';
        trigger(showLabelsEl);
        trigger(coordPrecisionEl);
        await delay(50);

        PASS('COORD-1', 'Coordinate precision options (auto, 0, 1, 2, 3) and visibility toggle functional',
             'Verified precision formatting and visibility toggle');

        // ==========================================
        // 5. VIEW CONTROLS (PAN, ZOOM, RESET VIEW)
        // ==========================================

        // 5.1 Zoom slider
        viewZoomEl.value = '1.5';
        trigger(viewZoomEl);
        await delay(50);

        // 5.2 Pan interaction (mousedown on empty canvas at (50, 50), drag to (150, 150))
        const rect = canvas.getBoundingClientRect();
        canvas.dispatchEvent(new win.MouseEvent('mousedown', {
          bubbles: true,
          clientX: rect.left + 50,
          clientY: rect.top + 50
        }));
        canvas.dispatchEvent(new win.MouseEvent('mousemove', {
          bubbles: true,
          clientX: rect.left + 150,
          clientY: rect.top + 150
        }));
        win.dispatchEvent(new win.MouseEvent('mouseup', { bubbles: true }));
        await delay(50);

        // Check that Reset View button restores viewZoom to 1.0 without modifying points
        resetViewBtn.click();
        await delay(50);

        const currentPoints = pointsInput.value;
        const zoomRestored = viewZoomEl.value === '1.0' || Number(viewZoomEl.value) === 1;
        const pointsUnchanged = currentPoints.includes('R(4,10/9)');

        if (zoomRestored && pointsUnchanged) {
          PASS('VIEW-1', 'Pan, zoom, and Reset View: reset restores origin/zoom without deleting or modifying points',
               `Zoom=${viewZoomEl.value}, InputText preserved`);
        } else {
          FAIL('VIEW-1', 'Reset view failed', `Zoom=${viewZoomEl.value}, points=${currentPoints}`);
        }

        // ==========================================
        // 6. ACTUAL PNG EXPORT WITH PHASE 2.4 CUSTOMIZATIONS
        // ==========================================

        // Configure distinct Phase 2.4 styling for export:
        // 1. Background color = #f5f5dc (Beige: 245, 245, 220)
        canvasBgColorEl.value = '#f5f5dc';
        trigger(canvasBgColorEl);

        // 2. Axis color = #800000 (Maroon: 128, 0, 0), width = 4
        axisColorEl.value = '#800000';
        axisWidthEl.value = '4';
        trigger(axisColorEl);
        trigger(axisWidthEl);

        // 3. Grid line color = #008080 (Teal), opacity = 40%
        gridColorEl.value = '#008080';
        gridOpacityEl.value = '40';
        gridVisibleEl.checked = true;
        trigger(gridColorEl);
        trigger(gridOpacityEl);
        trigger(gridVisibleEl);
        await delay(50);

        // Intercept downloadBtn click
        let exportData = null;
        const origClick = win.HTMLAnchorElement.prototype.click;
        win.HTMLAnchorElement.prototype.click = function() {
          exportData = { download: this.download, href: this.href };
        };

        downloadBtn.click();
        win.HTMLAnchorElement.prototype.click = origClick;

        if (!exportData || !exportData.href.startsWith('data:image/png;base64,')) {
          FAIL('EXPORT-P24', 'Download button failed to produce data URL', JSON.stringify(exportData));
        } else {
          // Decode image and test pixels
          const img = new Image();
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = exportData.href;
          });

          const expCanvas = document.createElement('canvas');
          expCanvas.width = img.width;
          expCanvas.height = img.height;
          const expCtx = expCanvas.getContext('2d');
          expCtx.drawImage(img, 0, 0);

          const imgData = expCtx.getImageData(0, 0, expCanvas.width, expCanvas.height);
          const d = imgData.data;

          // Check corner pixel (20, 20) matches Beige background (245, 245, 220)
          const cornerIdx = (20 * expCanvas.width + 20) * 4;
          const bgR = d[cornerIdx], bgG = d[cornerIdx+1], bgB = d[cornerIdx+2];

          // Check for Maroon axis pixels (R > 100, G < 40, B < 40)
          let maroonCount = 0;
          for (let i = 0; i < d.length; i += 4) {
            if (d[i] >= 110 && d[i] <= 150 && d[i+1] <= 30 && d[i+2] <= 30 && d[i+3] === 255) {
              maroonCount++;
            }
          }

          log(`Exported image audit -> Background RGB=(${bgR},${bgG},${bgB}), Maroon Axis pixels: ${maroonCount}`);

          const bgMatches = Math.abs(bgR - 245) <= 5 && Math.abs(bgG - 245) <= 5 && Math.abs(bgB - 220) <= 5;

          if (bgMatches && maroonCount > 300) {
            PASS('EXPORT-P24', 'Actual PNG export button reflects customized background and axis styling in decoded image',
                 `Beige BG verified (${bgR},${bgG},${bgB}), Maroon axis pixels count=${maroonCount}`);
          } else {
            FAIL('EXPORT-P24', 'Exported image missing customized styles', `BG=(${bgR},${bgG},${bgB}), Maroon=${maroonCount}`);
          }
        }

        log('\n=== ALL PHASE 2.4 BROWSER TESTS COMPLETE ===');

      } catch (err) {
        FAIL('EXCEPTION', 'Unhandled error in test runner', err.stack || err.message);
      }
    };
  </script>
</body>
</html>
